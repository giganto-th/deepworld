name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # The site is static. /thai is the same page in Thai-only mode, so the build copies
      # index.html to thai/index.html with <base href="../"> for its relative paths.
      - name: Build site
        run: |
          mkdir -p _site/thai
          cp -r index.html src _site/
          sed 's|<head>|<head>\n  <base href="../">|' index.html > _site/thai/index.html

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
